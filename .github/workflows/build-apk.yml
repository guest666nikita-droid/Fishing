namename: Generate APK from HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем ваш код
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем Java 11 (самая стабильная версия для Cordova)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # 3. Настраиваем Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4. Собираем приложение через Cordova
      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create build_folder com.nikitadroid.fishing "Fishing Game"
          rm -rf build_folder/www/*
          cp -r . build_folder/www/ || true
          cd build_folder
          cordova platform add android
          cordova build android --device

      # 5. Сохраняем готовый APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build_folder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
