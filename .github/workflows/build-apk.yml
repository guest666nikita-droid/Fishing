name: Generate APK from HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Скачиваем ваш HTML/CSS
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Собираем APK с помощью официального инструмента Google Bubblewrap
      - name: Build Android APK
        uses: s0/action-web-to-apk@v2.2.0
        with:
          app-name: "Fishing Game"
          package-id: "com.nikitadroid.fishing"
          web-root: "." # Ищет index.html прямо в корне репозитория

      # 3. Публикуем чистый APK в Релизы без ZIP-архивов
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Fishing Game v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          files: ./**/*.apk
