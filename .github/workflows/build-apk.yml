name: Generate APK from HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем ваш HTML/CSS код
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Устанавливаем Java для сборки Android приложений
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Инициализируем Capacitor и собираем проект
      - name: Build Android App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npx cap init "Fishing Game" "com.nikitadroid.fishing" --web-dir=.
          npm install @capacitor/android
          npx cap add android
          npx cap sync
          cd android && ./gradlew assembleDebug

      # 5. Сохраняем готовый APK файл в артефакты
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
