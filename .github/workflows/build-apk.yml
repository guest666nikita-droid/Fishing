name: Generate APK from HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. Скачиваем ваш код
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем Java 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      # 3. Настраиваем Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4. Собираем приложение через Cordova
      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create build_folder com.nikitadroid.fishing "Fishing Game"
          rm -rf build_folder/www/*
          cp -r . build_folder/www/ || true
          cd build_folder
          cordova platform add android
          cordova build android --device

      # 5. Публикуем чистый APK в Релизы без создания ZIP-архивов
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Fishing Game Release v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false
          files: build_folder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
